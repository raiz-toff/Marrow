<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Plan Command Console</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    
    <!-- js-yaml for client-side parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

    <script>
        // YAML Helper Functions
        function parseYaml(content) {
            try {
                return jsyaml.load(content);
            } catch (e) {
                console.error("YAML Parse Error:", e);
                return null;
            }
        }

        function stringifyYaml(obj) {
            try {
                return jsyaml.dump(obj);
            } catch (e) {
                console.error("YAML Stringify Error:", e);
                return "";
            }
        }
    </script>

    <style>
        {% include 'partials/editor_styles.html' %}
    </style>
</head>

<body>
    {% include 'partials/editor_body.html' %}
    
    <script>
        {% include 'partials/editor_scripts.html' %}
    </script>
</body>

</html>
