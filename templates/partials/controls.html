<!-- Back to Project Button -->
{% if project_url and project_url != '#' %}
<a href="{{ project_url }}" class="project-btn glass" title="Back to Project">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    <span>Project</span>
</a>
{% endif %}

<!-- Mini-Map -->
<div class="minimap" x-show="true" 
     @mousedown="startMinimapDrag($event)"
     @mousemove.window="dragMinimap($event)" 
     @mouseup.window="stopMinimapDrag()"
     @touchstart.passive="startMinimapDrag($event)"
     @touchmove.window="dragMinimap($event)"
     @touchend.window="stopMinimapDrag()">
    <canvas id="minimap-canvas" width="200" height="140"></canvas>
</div>

<!-- Zoom Controls -->
<div class="zoom-controls">
    <button class="zoom-btn" @click="zoomIn()" title="Zoom In">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>
    <button class="zoom-btn" @click="zoomOut()" title="Zoom Out">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>
    <button class="zoom-btn" @click="resetView()" title="Fit to Screen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
    </button>
    <div class="divider"></div>
    <button class="zoom-btn" @click="toggleLock()" :class="{ 'active': isLocked }" :title="isLocked ? 'Unlock Nodes' : 'Lock Nodes'">
        <svg x-show="isLocked" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <svg x-show="!isLocked" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
        </svg>
    </button>
</div>

<!-- Stylized Watermark -->
<div class="watermark">
    <h2>{{ title }}</h2>
    <p>RAJKUMAR NEUPANE</p>
</div>
