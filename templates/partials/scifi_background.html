<canvas id="scifi-bg"></canvas>

<style>
    #scifi-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1; /* Sit above body bg, below UI */
        pointer-events: none;
        transition: opacity 0.5s ease;
    }

    /* Light mode adjustment */
    .light-mode #scifi-bg {
        opacity: 0.6;
    }
</style>

<script>
    (function initSciFiBg() {
        console.log("Initializing Sci-Fi Background...");
        const canvas = document.getElementById('scifi-bg');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let mouse = { x: 0, y: 0 };
        
        // Configuration
        const cfg = {
            particleCount: 100, // Balanced for performance
            connectionDist: 150,
            speed: 0.3,
            baseColor: { r: 99, g: 102, b: 241 } // Indigo-500 #6366f1
        };

        // Resize Handling
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }
        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Particle Class
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * cfg.speed;
                this.vy = (Math.random() - 0.5) * cfg.speed;
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.pulse = Math.random() * 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Pulse alpha
                this.alpha += this.pulse;
                if (this.alpha > 0.6 || this.alpha < 0.1) this.pulse *= -1;
            }

            draw() {
                // Check theme directly from body class
                const isLight = document.body.classList.contains('light-mode');
                const color = isLight ? '100, 116, 139' : `${cfg.baseColor.r}, ${cfg.baseColor.g}, ${cfg.baseColor.b}`; // Slate-500 vs Indigo

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${color}, ${this.alpha})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            
            // Adjust count based on screen size
            const count = Math.min((width * height) / 15000, 120);
            
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            const isLight = document.body.classList.contains('light-mode');
            const color = isLight ? '100, 116, 139' : `${cfg.baseColor.r}, ${cfg.baseColor.g}, ${cfg.baseColor.b}`;

            // Update and Draw Particles
            particles.forEach((p, index) => {
                p.update();
                p.draw();

                // Draw Connections
                for (let j = index + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < cfg.connectionDist) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(${color}, ${0.15 - (dist / cfg.connectionDist) * 0.15})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
                
                // Mouse Interaction (Parallax)
                const dx = mouse.x - p.x;
                const dy = mouse.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 200) {
                    p.x -= dx * 0.005; 
                    p.y -= dy * 0.005;
                }
            });

            requestAnimationFrame(animate);
        }

        // Start
        resize();
        animate();
    })();
</script>
