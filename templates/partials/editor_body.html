<header>
        <div class="brand">
            <svg viewBox="0 0 24 24">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
            </svg>
            <div>
                <div style="line-height: 1;">NET.COMMAND</div>
                <div style="font-size: 0.6rem; color: var(--text-muted); letter-spacing: 0.2em; margin-top: 2px;">
                    TOPOLOGY ARCHITECT</div>
            </div>
        </div>

        <!-- File Selector -->
        <div class="file-selector">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
            </svg>
            <select id="file-select" onchange="switchFile(this.value)">
                <option value="">Loading files...</option>
            </select>
            <button class="btn btn-sm" onclick="createNewFile()" title="New Topology">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
        </div>

        <div class="actions">
            <div id="status-display" class="status-container">
                <div class="status-dot"></div>
                <span>Initializing System...</span>
            </div>


            <button class="btn" onclick="openIconPicker()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="14" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                </svg>
                Library
            </button>

            <button class="btn" onclick="openCablePicker()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14" />
                    <path d="M5 12l4-4" />
                    <path d="M5 12l4 4" />
                </svg>
                Cables
            </button>

            <button class="btn" onclick="downloadYaml()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                Export
            </button>
            <button class="btn btn-primary" onclick="recompile()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10" />
                    <polyline points="1 20 1 14 7 14" />
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                </svg>
                Build
            </button>
        </div>
    </header>

    <main>
        <section class="pane-left">
            <div id="editor-container">
                <button id="floating-icon-btn" class="icon-toggle-btn" onclick="openIconPicker()">🔍 Pick Icon</button>
                <button id="floating-color-btn" class="icon-toggle-btn" style="background:var(--accent-blue); display:none;" onclick="openColorPicker()">🎨 Pick Color</button>
                <button id="floating-node-btn" class="icon-toggle-btn" style="background:var(--accent-blue); display:none;" onclick="openNodePicker()">🎯 Pick Node</button>
                <button id="floating-cable-btn" class="icon-toggle-btn" style="background:var(--accent-blue); display:none;" onclick="openCablePicker()">🔌 Pick Cable</button>
            </div>

            <div class="console-header">
                <span>Console Output</span>
                <span style="opacity:0.5">READY</span>
            </div>
            <div class="console-output" id="console">
                <div class="log-entry">
                    <span class="log-time">[SYSTEM]</span>
                    <span class="log-system">Kernel Initialized. Loading Monaco Environment...</span>
                </div>
            </div>
        </section>

        <section class="pane-right">
            <div class="loader" id="loader">
                <div class="spinner"></div>
            </div>

            <!-- VISUAL TOOLBAR -->
            <div class="visual-toolbar">
                <div class="tool-btn" onclick="openNodeWizard()" title="Add Node">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                </div>
                <div class="tool-btn" onclick="openLinkWizard()" title="Add Connection">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                </div>
            </div>

            <iframe id="preview-frame" src="/preview" title="Network Topology"></iframe>
        </section>
    </main>

    <!-- ICON MODAL -->
    <div class="icon-modal-overlay" id="icon-modal">
        <div class="icon-modal">
            <div class="icon-modal-header">
                <span class="wizard-title">Asset Library</span>
                <div class="icon-search-container">
                    <input type="text" class="icon-search" id="icon-search-input"
                        placeholder="Search devices (e.g. router, switch, cloud)...">
                    <button class="close-btn" onclick="closeIconPicker()">×</button>
                </div>
            </div>
            <div class="icon-grid" id="icon-grid">
                <!-- JS Populated -->
            </div>
        </div>
    </div>

    <!-- NODE MODAL -->
    <div class="icon-modal-overlay" id="node-modal">
        <div class="icon-modal" style="width: 500px; height: 500px;">
            <div class="icon-modal-header">
                <span class="wizard-title">Available Nodes</span>
                <div class="icon-search-container">
                    <input type="text" class="icon-search" id="node-search-input" placeholder="Filter nodes...">
                </div>
                <button class="close-btn" onclick="closeNodePicker()">×</button>
            </div>
            <div class="node-list" id="node-picker-list">
                <!-- JS Populated -->
            </div>
        </div>
    </div>

    <!-- COLOR MODAL -->
    <div class="wizard-overlay" id="color-modal">
        <div class="icon-modal" style="width:500px; height: auto;">
            <div class="icon-modal-header">
                <span class="wizard-title">Color Palette</span>
                <button class="close-btn" onclick="closeColorPicker()">✕</button>
            </div>
            <div class="color-grid" id="color-grid">
                <!-- Colors injected here -->
            </div>
        </div>
    </div>

    <!-- CABLE MODAL -->
    <div class="icon-modal-overlay" id="cable-modal">
        <div class="icon-modal" style="width: 500px; height: 600px;">
            <div class="icon-modal-header">
                <span class="wizard-title">Cable Types</span>
                <div class="icon-search-container">
                    <input type="text" class="icon-search" id="cable-search-input" placeholder="Search cables...">
                </div>
                <button class="close-btn" onclick="closeCablePicker()">×</button>
            </div>
            <div class="node-list" id="cable-list">
                <!-- JS Populated -->
            </div>
        </div>
    </div>

    <!-- NODE WIZARD -->
    <div class="wizard-overlay" id="node-wizard">
        <div class="wizard-card" style="width: 500px;">
            <div class="wizard-header">
                <div class="wizard-title">Add Network Node</div>
                <button class="close-btn" onclick="closeWizards()">✕</button>
            </div>
            <div class="wizard-body">
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Node ID *</label>
                        <input type="text" class="form-input" id="wn-id" placeholder="CORE_01" oninput="validateNodeForm()">
                        <div class="form-error" id="wn-id-error"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Role</label>
                        <div style="position:relative">
                            <select class="form-input" id="wn-role" style="appearance:none; cursor:pointer;">
                                <option value="router">Router</option>
                                <option value="switch" selected>Switch</option>
                                <option value="firewall">Firewall</option>
                                <option value="server">Server</option>
                                <option value="cloud">Cloud</option>
                                <option value="host">Host/PC</option>
                                <option value="wireless">Access Point</option>
                            </select>
                            <div style="position:absolute; right:12px; top:12px; pointer-events:none; color:var(--text-muted)">▼</div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Display Label</label>
                    <input type="text" class="form-input" id="wn-label" placeholder="Core Router">
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Icon</label>
                        <div style="display:flex; gap:8px;">
                            <input type="text" class="form-input" id="wn-icon" placeholder="Use default">
                            <button class="btn btn-sm" onclick="openIconPicker('wn-icon')" style="height:42px;">Pick</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Hierarchy Level</label>
                        <div style="position:relative">
                            <select class="form-input" id="wn-level" style="appearance:none; cursor:pointer;">
                                <option value="1">Level 1 (Core)</option>
                                <option value="2" selected>Level 2 (Dist)</option>
                                <option value="3">Level 3 (Access)</option>
                            </select>
                            <div style="position:absolute; right:12px; top:12px; pointer-events:none; color:var(--text-muted)">▼</div>
                        </div>
                    </div>
                </div>
                
                <div class="grid-2">
                     <div class="form-group">
                        <label class="form-label">IP Address</label>
                        <input type="text" class="form-input" id="wn-ip" placeholder="192.168.1.1">
                    </div>
                     <div class="form-group">
                        <label class="form-label">Parent Group/Node</label>
                        <input list="node-list" class="form-input" id="wn-parent" placeholder="Optional parent...">
                    </div>
                </div>

                <details style="margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                    <summary style="cursor: pointer; color: var(--primary); font-size: 0.8rem; font-weight: 600; text-transform: uppercase;">Advanced Configuration</summary>
                    <div style="margin-top: 1rem;">
                        <div class="grid-2">
                            <div class="form-group">
                                <label class="form-label">X Position</label>
                                <input type="number" class="form-input" id="wn-x" placeholder="Auto">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Y Position</label>
                                <input type="number" class="form-input" id="wn-y" placeholder="Auto">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Design Notes</label>
                            <textarea class="form-input" id="wn-notes" rows="2" placeholder="Architecture notes..."></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Running Config Snippet</label>
                            <textarea class="form-input" id="wn-config" rows="3" style="font-family:monospace" placeholder="interface Gi0/1..."></textarea>
                        </div>
                    </div>
                </details>

                <div class="wizard-actions">
                    <button class="btn" onclick="closeWizards()">Cancel</button>
                    <button class="btn btn-primary" onclick="createNode()" id="wn-submit">Create Node</button>
                </div>
            </div>
        </div>
    </div>

    <!-- LINK WIZARD -->
    <div class="wizard-overlay" id="link-wizard">
        <div class="wizard-card">
            <div class="wizard-header">
                <div class="wizard-title">Add Connection</div>
                <button class="close-btn" onclick="closeWizards()">✕</button>
            </div>

            <div class="wizard-body">
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Source Node (From) *</label>
                        <input list="node-list" class="form-input" id="wl-from" placeholder="Select Source">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Target Node (To) *</label>
                        <input list="node-list" class="form-input" id="wl-to" placeholder="Select Target">
                    </div>
                </div>
                <datalist id="node-list"></datalist>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Source Port</label>
                        <input type="text" class="form-input" id="wl-from-port" placeholder="Gi0/1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Dest Port</label>
                        <input type="text" class="form-input" id="wl-to-port" placeholder="Fa0/1">
                    </div>
                </div>
                
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Source IP (CIDR)</label>
                        <input type="text" class="form-input" id="wl-from-ip" placeholder="10.0.0.1/30">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Dest IP (CIDR)</label>
                        <input type="text" class="form-input" id="wl-to-ip" placeholder="10.0.0.2/30">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Cable Type</label>
                    <div style="position:relative">
                        <select class="form-input" id="wl-type" style="appearance:none; cursor:pointer;">
                            <option value="ethernet">Ethernet (Solid)</option>
                            <option value="trunk">Trunk (Dashed)</option>
                            <option value="fiber">Fiber (Cyan Glow)</option>
                            <option value="smf">Single-Mode (Yellow)</option>
                            <option value="serial">Serial (Lightning)</option>
                            <option value="console">Console (Dotted)</option>
                            <option value="wireless">Wireless (Signal)</option>
                            <option value="power">Power (Thick)</option>
                        </select>
                        <div style="position:absolute; right:12px; top:12px; pointer-events:none; color:var(--text-muted)">▼</div>
                    </div>
                </div>
                
                <details style="margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                    <summary style="cursor: pointer; color: var(--primary); font-size: 0.8rem; font-weight: 600; text-transform: uppercase;">Layer 2 Configuration</summary>
                    <div style="margin-top: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Switchport Mode</label>
                            <div style="position:relative">
                                <select class="form-input" id="wl-l2-mode" style="appearance:none; cursor:pointer;">
                                    <option value="">Default</option>
                                    <option value="access">Access</option>
                                    <option value="trunk">Trunk</option>
                                    <option value="routed">Routed</option>
                                </select>
                                <div style="position:absolute; right:12px; top:12px; pointer-events:none; color:var(--text-muted)">▼</div>
                            </div>
                        </div>
                        <div class="grid-2">
                            <div class="form-group">
                                <label class="form-label">Access/Native VLAN</label>
                                <input type="text" class="form-input" id="wl-l2-vlan" placeholder="10">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Allowed VLANs</label>
                                <input type="text" class="form-input" id="wl-l2-allowed" placeholder="10,20,99">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Link Notes</label>
                            <textarea class="form-input" id="wl-notes" rows="1" placeholder="Connection details..."></textarea>
                        </div>
                    </div>
                </details>

                <div class="wizard-actions">
                    <button class="btn" onclick="closeWizards()">Cancel</button>
                    <button class="btn btn-primary" onclick="createLink()">Create Link</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Datalist for Autocomplete -->
    <datalist id="node-list"></datalist>
```
