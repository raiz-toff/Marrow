<div class="command-palette-overlay" :class="{ 'active': showPalette }" @click.self="showPalette = false">
    <div class="command-palette">
        <!-- Input Area (Using classes inferred from CSS) -->
        <div class="palette-input-wrapper">
             <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" x-model="searchQuery" x-ref="paletteInput" class="palette-input" placeholder="Search for nodes, IPs, or tags..." @keydown.enter="executeSearch()">
        </div>

        <!-- Results List -->
        <div class="palette-results">
            <template x-for="node in filteredNodes" :key="node.id">
                <div class="palette-item" @click="focusNode(node)">
                    <!-- Icon -->
                    <div class="palette-item-icon">
                         <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                            <path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/>
                        </svg>
                    </div>
                    
                    <!-- Text Info -->
                    <div class="palette-item-text">
                        <div class="palette-item-title" x-text="node.label || node.id"></div>
                        <div class="palette-item-subtitle" x-text="node.id"></div>
                    </div>

                    <!-- Meta/Shortcut -->
                    <div class="palette-shortcut" x-text="node.type ? node.type.toUpperCase() : 'NODE'"></div>
                </div>
            </template>
            
            <div class="palette-empty" x-show="filteredNodes.length === 0" style="padding:2rem; text-align:center; color:var(--text-muted); font-size:0.9rem;">
                <span>No matching nodes found.</span>
            </div>
        </div>
        
        <div class="palette-footer" style="padding:0.75rem 1.25rem; background:var(--bg-deep); border-top:1px solid var(--glass-border); font-size:0.75rem; color:var(--text-muted); display:flex; gap:1rem;">
            <div style="display:flex; align-items:center; gap:0.4rem"><kbd style="background:var(--block-bg); border:1px solid var(--glass-border); padding:1px 4px; border-radius:3px; font-family:monospace;">⏎</kbd> to select</div>
        </div>
    </div>
</div>
