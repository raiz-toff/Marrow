<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Icon Exporter & Renamer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        .checkerboard {
            background-color: #f8fafc;
            background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%), linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e2e8f0 75%), linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen p-6 text-slate-900">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-end mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-blue-600 flex items-center gap-2">
                    <span class="text-3xl">🧩</span> SVG Atlas Exporter
                </h1>
                <p class="text-slate-500 italic">Advanced metadata detection & batch renaming for Cisco/Draw.io</p>
            </div>
            <div id="stats" class="hidden text-right">
                <span id="count" class="text-3xl font-bold text-blue-600">0</span>
                <span class="text-slate-500 block text-sm font-medium">Icons Extracted</span>
            </div>
        </header>

        <!-- Drop Zone -->
        <div id="dropZone"
            class="group bg-white rounded-2xl shadow-sm border-2 border-dashed border-slate-300 p-12 text-center hover:border-blue-500 transition-all cursor-pointer mb-8">
            <input type="file" id="fileInput" accept=".svg" class="hidden">
            <div class="flex flex-col items-center gap-4">
                <div
                    class="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center text-3xl group-hover:scale-110 transition-transform">
                    📥
                </div>
                <div>
                    <p class="text-lg font-semibold text-slate-700">Drop your SVG atlas here</p>
                    <p class="text-slate-400 text-sm">Draw.io, Cisco, or any grouped SVG</p>
                </div>
            </div>
        </div>

        <!-- Toolbar -->
        <div id="toolbar"
            class="hidden flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-200 gap-4">
            <!-- Batch Rename -->
            <div class="flex items-center gap-2 w-full md:w-auto bg-slate-50 p-1 rounded-lg border border-slate-200">
                <input type="text" id="prefixInput" placeholder="Batch prefix (e.g. cisco)"
                    class="bg-transparent text-sm px-3 py-1.5 focus:outline-none w-full md:w-48">
                <button id="applyPrefixBtn"
                    class="bg-white border hover:bg-slate-100 text-slate-700 px-4 py-1.5 rounded-md text-xs font-bold transition-all whitespace-nowrap shadow-sm">
                    RENAME ALL
                </button>
            </div>

            <div class="flex flex-col md:flex-row gap-4 w-full md:w-auto items-center">
                <div class="flex items-center gap-2 bg-slate-50 p-1 rounded-lg border border-slate-200">
                    <input type="text" id="zipNameInput" placeholder="ZIP filename" value="extracted_icons"
                        class="bg-transparent text-sm px-3 py-1.5 focus:outline-none w-32 md:w-40 font-medium">
                    <span class="text-xs text-slate-400 font-bold pr-2">.zip</span>
                </div>
                <button id="downloadZip"
                    class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold flex items-center justify-center gap-2 transition-all shadow-md">
                    📦 Download ZIP
                </button>
            </div>
        </div>

        <!-- Result Grid -->
        <div id="grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
    </div>

    <!-- Hidden Processing Area -->
    <div id="workspace" class="fixed -top-[9999px] -left-[9999px] opacity-0 pointer-events-none"></div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const workspace = document.getElementById('workspace');
        const grid = document.getElementById('grid');
        const toolbar = document.getElementById('toolbar');
        const countSpan = document.getElementById('count');
        const stats = document.getElementById('stats');
        const prefixInput = document.getElementById('prefixInput');
        const applyPrefixBtn = document.getElementById('applyPrefixBtn');
        const zipNameInput = document.getElementById('zipNameInput');

        let extracted = [];

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => e.target.files[0] && loadFile(e.target.files[0]);

        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('border-blue-500', 'bg-blue-50'); };
        dropZone.ondragleave = () => dropZone.classList.remove('border-blue-500', 'bg-blue-50');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500', 'bg-blue-50');
            if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
        };

        applyPrefixBtn.onclick = () => {
            const prefix = prefixInput.value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '_');
            if (!prefix) return;
            const inputs = document.querySelectorAll('.icon-name-input');
            extracted.forEach((item, i) => {
                const newName = `${prefix}_${i + 1}`;
                item.name = newName;
                if (inputs[i]) inputs[i].value = newName;
            });
        };

        function loadFile(file) {
            // Auto-set ZIP name from imported filename
            const baseName = file.name.replace(/\.[^/.]+$/, "");
            zipNameInput.value = baseName;

            const reader = new FileReader();
            reader.onload = (e) => process(e.target.result);
            reader.readAsText(file);
        }

        function extractNames(svg) {
            const list = [];
            const content = svg.getAttribute('content');
            if (content) {
                const xml = new DOMParser().parseFromString(content, "text/xml");
                xml.querySelectorAll('mxCell[vertex="1"]').forEach(cell => {
                    const style = cell.getAttribute('style') || "";
                    const val = cell.getAttribute('value') || "";

                    // Try resIcon first (Cisco SAFE Architecture format)
                    const resIconMatch = style.match(/resIcon=([^;]+)/);
                    if (resIconMatch) {
                        list.push(resIconMatch[1].split('.').pop());
                    }
                    // Then try shape (standard mxGraph format)
                    else {
                        const shapeMatch = style.match(/shape=([^;]+)/);
                        if (shapeMatch) {
                            list.push(shapeMatch[1].split('.').pop());
                        } else if (val) {
                            list.push(val);
                        }
                    }
                });
            }
            return list;
        }

        function process(svgRaw) {
            grid.innerHTML = '';
            workspace.innerHTML = svgRaw;
            extracted = [];

            const svg = workspace.querySelector('svg');
            if (!svg) return alert("Valid SVG not found");

            const metadataNames = extractNames(svg);

            // Find icons. Primary guess is groups with data-cell-id
            let items = Array.from(svg.querySelectorAll('g[data-cell-id]'))
                .filter(g => !['0', '1'].includes(g.getAttribute('data-cell-id')));

            if (items.length === 0) {
                items = Array.from(svg.children).filter(el => el.tagName === 'g');
            }

            items.forEach((group, i) => {
                const bbox = group.getBBox();
                if (bbox.width < 1 || bbox.height < 1) return;

                const pad = 2;
                const vb = `${bbox.x - pad} ${bbox.y - pad} ${bbox.width + (pad * 2)} ${bbox.height + (pad * 2)}`;

                // Naming Strategy
                let rawName = metadataNames[i] || group.id || group.getAttribute('label') || `icon_${i + 1}`;
                const sanitizedNameBase = rawName.toLowerCase().replace(/[^a-z0-9_-]/g, '_');

                const cleanGroup = group.cloneNode(true);
                cleanGroup.removeAttribute('data-cell-id');

                const svgPayload = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}">${cleanGroup.outerHTML}</svg>`;

                const item = {
                    name: sanitizedNameBase,
                    svg: svgPayload
                };

                extracted.push(item);
                renderCard(item, i);
            });

            countSpan.innerText = extracted.length;
            stats.classList.remove('hidden');
            toolbar.classList.remove('hidden');
        }

        function renderCard(item, index) {
            const card = document.createElement('div');
            card.className = "bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-col group transition-all hover:shadow-md";

            const preview = document.createElement('div');
            preview.className = "w-full aspect-square checkerboard rounded-lg flex items-center justify-center p-4 mb-3";
            preview.innerHTML = item.svg;

            const nameInput = document.createElement('input');
            nameInput.type = "text";
            nameInput.className = "icon-name-input text-[11px] font-bold text-slate-700 bg-slate-50 border border-slate-200 rounded px-2 py-1 mb-2 focus:ring-1 focus:ring-blue-500 w-full";
            nameInput.value = item.name;
            nameInput.oninput = (e) => {
                item.name = e.target.value.toLowerCase().replace(/[^a-z0-9_-]/g, '_');
            };

            const btn = document.createElement('button');
            btn.className = "w-full py-1.5 text-[10px] uppercase tracking-widest font-black rounded-lg bg-slate-100 hover:bg-blue-600 hover:text-white transition-all";
            btn.innerText = "SAVE SVG";
            btn.onclick = () => saveAs(new Blob([item.svg], { type: 'image/svg+xml' }), item.name + '.svg');

            card.append(preview, nameInput, btn);
            grid.appendChild(card);
        }

        document.getElementById('downloadZip').onclick = () => {
            const zip = new JSZip();
            const used = new Set();
            extracted.forEach(f => {
                let name = f.name;
                let counter = 1;
                while (used.has(name)) { name = `${f.name}_${counter++}`; }
                used.add(name);
                zip.file(name + '.svg', new Blob([f.svg], { type: 'image/svg+xml' }));
            });
            const zipName = zipNameInput.value.trim().replace(/[^a-z0-9_-]/gi, '_') || 'extracted_icons';
            zip.generateAsync({ type: "blob" }).then(c => saveAs(c, zipName + ".zip"));
        };
    </script>
</body>

</html>
