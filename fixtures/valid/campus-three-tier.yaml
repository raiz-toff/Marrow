marrow: 2
name: Campus Three-Tier
description: Classic core/distribution/access campus with an HA core and LAG uplinks
theme: dark
x-designer-note: keep the core pair visually mirrored

zones:
  - id: campus
    name: Campus
  - id: core
    name: Core
    parent: campus
  - id: building-a
    name: Building A
    parent: campus
  - id: building-b
    name: Building B
    parent: campus
  - id: datacenter
    name: Datacenter
    parent: campus

devices:
  - id: core-sw-01
    name: Core Switch 1
    icon: cisco/switches/layer-3-switch
    tier: core
    zone: core
    ha_pair_with: core-sw-02
    mgmt_ip: 10.255.0.1
    hero: true
  - id: core-sw-02
    name: Core Switch 2
    icon: cisco/switches/layer-3-switch
    tier: core
    zone: core
    ha_pair_with: core-sw-01
    mgmt_ip: 10.255.0.2
  - id: dist-a-01
    name: Distribution A1
    icon: cisco/switches/multilayer-remote-switch
    tier: distribution
    zone: building-a
  - id: dist-a-02
    name: Distribution A2
    icon: cisco/switches/multilayer-remote-switch
    tier: distribution
    zone: building-a
  - id: dist-b-01
    name: Distribution B1
    icon: cisco/switches/multilayer-remote-switch
    tier: distribution
    zone: building-b
  - id: dist-b-02
    name: Distribution B2
    icon: cisco/switches/multilayer-remote-switch
    tier: distribution
    zone: building-b
  - id: acc-a-11
    name: Access A-11
    icon: cisco/switches/workgroup-switch
    tier: access
    zone: building-a
  - id: acc-a-12
    name: Access A-12
    icon: cisco/switches/workgroup-switch
    tier: access
    zone: building-a
  - id: acc-a-13
    name: Access A-13
    icon: cisco/switches/workgroup-switch
    tier: access
    zone: building-a
  - id: acc-b-11
    name: Access B-11
    icon: cisco/switches/workgroup-switch
    tier: access
    zone: building-b
  - id: acc-b-12
    name: Access B-12
    icon: cisco/switches/workgroup-switch
    tier: access
    zone: building-b
  - id: dc-sw-01
    name: Datacenter Switch
    icon: cisco/switches/layer-3-switch
    tier: distribution
    zone: datacenter
  - id: srv-app-01
    name: App Server
    icon: cisco/servers/file-server
    tier: endpoint
    zone: datacenter
  - id: srv-db-01
    name: DB Server
    icon: cisco/servers/host
    tier: endpoint
    zone: datacenter

links:
  # HA core interconnect — two members of port-channel po1
  - from: core-sw-01:Te1/0/1
    to: core-sw-02:Te1/0/1
    kind: dac
    speed: 40G
    lag: po1
  - from: core-sw-01:Te1/0/2
    to: core-sw-02:Te1/0/2
    kind: dac
    speed: 40G
    lag: po1
  # core → distribution
  - from: core-sw-01:Te1/0/10
    to: dist-a-01:Te1/1/1
    kind: fiber
    speed: 40G
  - from: core-sw-02:Te1/0/10
    to: dist-a-02:Te1/1/1
    kind: fiber
    speed: 40G
  - from: core-sw-01:Te1/0/11
    to: dist-b-01:Te1/1/1
    kind: fiber
    speed: 40G
  - from: core-sw-02:Te1/0/11
    to: dist-b-02:Te1/1/1
    kind: fiber
    speed: 40G
  - from: core-sw-01:Te1/0/12
    to: dc-sw-01:Te1/1/1
    kind: fiber
    speed: 100G
    animated: true
  - from: core-sw-02:Te1/0/12
    to: dc-sw-01:Te1/1/2
    kind: fiber
    speed: 100G
  # distribution cross-links
  - from: dist-a-01:Te1/1/2
    to: dist-a-02:Te1/1/2
    kind: dac
    speed: 40G
  - from: dist-b-01:Te1/1/2
    to: dist-b-02:Te1/1/2
    kind: dac
    speed: 40G
  # distribution → access
  - from: dist-a-01:Gi1/0/1
    to: acc-a-11:Gi0/48
    speed: 10G
    kind: fiber
  - from: dist-a-02:Gi1/0/1
    to: acc-a-12:Gi0/48
    speed: 10G
    kind: fiber
  - from: dist-a-01:Gi1/0/2
    to: acc-a-13:Gi0/48
    speed: 10G
    kind: fiber
  - from: dist-b-01:Gi1/0/1
    to: acc-b-11:Gi0/48
    speed: 10G
    kind: fiber
  - from: dist-b-02:Gi1/0/1
    to: acc-b-12:Gi0/48
    speed: 10G
    kind: fiber
  # datacenter servers
  - from: dc-sw-01:Gi1/0/10
    to: srv-app-01:eno1
    speed: 10G
  - from: dc-sw-01:Gi1/0/11
    to: srv-db-01:eno1
    speed: 10G
