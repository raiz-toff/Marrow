marrow: 2
name: Small Office
description: 10-device single-site office network
theme: dark
hero: edge-rt-01

zones:
  - id: edge
    name: Internet Edge
  - id: office
    name: Office LAN

devices:
  - id: edge-rt-01
    name: Edge Router
    icon: cisco/routers/router
    tier: edge
    zone: edge
    role: WAN edge
    mgmt_ip: 192.0.2.1
  - id: fw-01
    name: Perimeter Firewall
    icon: cisco/security/firewall
    tier: edge
    zone: edge
    mgmt_ip: 192.0.2.2
  - id: core-sw-01
    name: Core Switch
    icon: cisco/switches/layer-3-switch
    tier: core
    zone: office
    mgmt_ip: 10.0.0.10
    interfaces:
      - name: Gi1/0/1
        description: uplink to firewall
        vlan: 10
      - name: Gi1/0/10
        description: downlink to access 1
  - id: acc-sw-01
    name: Access Switch 1
    icon: cisco/switches/workgroup-switch
    tier: access
    zone: office
  - id: acc-sw-02
    name: Access Switch 2
    icon: cisco/switches/workgroup-switch
    tier: access
    zone: office
  - id: ap-01
    name: Office AP
    icon: cisco/routers/wireless-router
    tier: access
    zone: office
  - id: srv-file-01
    name: File Server
    icon: cisco/servers/file-server
    tier: endpoint
    zone: office
    mgmt_ip: 10.0.20.5
  - id: srv-backup-01
    name: Backup Server
    icon: cisco/servers/host
    tier: endpoint
    zone: office
  - id: pc-01
    name: Front Desk Laptop
    icon: cisco/computer-and-peripherals/laptop
    tier: endpoint
    zone: office
  - id: pc-02
    name: Design Workstation
    icon: cisco/computer-and-peripherals/macintosh
    tier: endpoint
    zone: office

links:
  - from: edge-rt-01:Gi0/0/1
    to: fw-01:outside
    kind: copper
    speed: 1G
  - from: fw-01:inside
    to: core-sw-01:Gi1/0/1
    kind: copper
    speed: 1G
    animated: true
  - from: core-sw-01:Gi1/0/10
    to: acc-sw-01:Gi0/24
    kind: fiber
    speed: 10G
  - from: core-sw-01:Gi1/0/11
    to: acc-sw-02:Gi0/24
    kind: fiber
    speed: 10G
  - from: acc-sw-01:Gi0/1
    to: ap-01:eth0
    kind: copper
    speed: 1G
  - from: core-sw-01:Gi1/0/20
    to: srv-file-01:eno1
    kind: copper
    speed: 10G
  - from: core-sw-01:Gi1/0/21
    to: srv-backup-01:eno1
    kind: copper
    speed: 1G
  - from: acc-sw-01:Gi0/2
    to: pc-01:eth0
  - from: acc-sw-02:Gi0/2
    to: pc-02:en0
