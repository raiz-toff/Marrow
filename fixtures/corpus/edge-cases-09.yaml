marrow: 2
name: Edge Case 09 - Port Label Fan-In
description: >
  Declutter stress case: one distribution switch with 20 ported uplinks to
  access switches, plus a ported server dual-homed pair. Historically every
  port chip landed 26px from the node and stacked into an unreadable pile;
  the placement solver must produce zero chip overlaps (L1 port-chip-overlap).

