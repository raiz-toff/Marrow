    name: Sales Laptop 2
    icon: cisco/endpoints/laptop
    tier: endpoint
    zone: sales
  - id: ws-eng1
    name: Engineering iMac 1
    icon: cisco/endpoints/macintosh
    tier: endpoint
    zone: engineering
  - id: ws-eng2
    name: Engineering Laptop 2
    icon: cisco/endpoints/laptop
    tier: endpoint
    zone: engineering
  - id: printer-sales1
    name: Sales Printer
    icon: cisco/endpoints/printer
    tier: endpoint
    zone: sales
  - id: srv-app1
    name: Application Server
    icon: cisco/servers/file-server
    tier: endpoint
    zone: dc
  - id: srv-host1
    name: Compute Host
    icon: cisco/servers/host
    tier: endpoint
    zone: dc

links:
