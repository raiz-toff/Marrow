marrow: 2
name: Field Office Beta
description: Single-homed field office with department zones, light theme, core switch as hero
theme: light
hero: core-sw1
zones:
  - id: perimeter
    name: Perimeter
  - id: core
    name: Core
  - id: sales
    name: Sales
  - id: engineering
    name: Engineering
  - id: dc
    name: Server Room

devices:
  - id: edge-rtr1
    name: Edge Router
    icon: cisco/routers/router
    tier: edge
    zone: perimeter
    mgmt_ip: 198.51.100.1
  - id: fw1
    name: Perimeter Firewall
    icon: cisco/security/firewall
    tier: edge
    zone: perimeter
    mgmt_ip: 10.20.0.1
  - id: core-sw1
    name: Core Switch
    icon: cisco/switches/layer-3-switch
    tier: core
    zone: core
    mgmt_ip: 10.20.1.1
    hero: true
  - id: acc-sales1
    name: Sales Access Switch
    icon: cisco/switches/workgroup-switch
    tier: access
    zone: sales
  - id: acc-eng1
