    kind: wan
    speed: 10M
    note: MPLS to Store North
  - from: sn-rt-01:Gi0/1
    to: sn-sw-01:Gi0/24
    kind: copper
    speed: 1G
  - from: sn-sw-01:Gi0/1
    to: sn-pos-01:eth0
  - from: sn-sw-01:Gi0/2
    to: sn-pos-02:eth0
  - from: hq-rt-01:Se0/0/1
    to: ss-rt-01:Se0/0/0
    kind: wan
    speed: 10M
    note: MPLS to Store South
  - from: ss-rt-01:Gi0/1
    to: ss-sw-01:Gi0/24
    kind: copper
    speed: 1G
  - from: ss-sw-01:Gi0/1
    to: ss-pos-01:eth0
  - from: hq-rt-01:Se0/0/2
    to: se-rt-01:Se0/0/0
    kind: wan
    speed: 10M
    note: MPLS to Store East
  - from: se-rt-01:Gi0/1
    to: se-sw-01:Gi0/24
    kind: copper
    speed: 1G
  - from: se-sw-01:Gi0/1
    to: se-pos-01:eth0
  - from: se-sw-01:Gi0/2
    to: se-ap-01:eth0
    kind: wireless
    speed: 1G
  - from: hq-rt-01:Gi0/0/2
    to: cloud-gw-01:wan0
    kind: wan
    speed: 1G
