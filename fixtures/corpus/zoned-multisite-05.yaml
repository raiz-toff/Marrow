marrow: 2
name: MSP Core POP with Four Customer Tenants
description: Managed service provider core POP fanning out VPN tunnels to four differently-sized customer sites nested under a shared customers zone
theme: dark
hero: pop-core-01

zones:
  - id: pop
    name: MSP Core POP
    accent: "#1e293b"
    note: Shared infrastructure serving every tenant
  - id: customers
    name: Customer Shared Services
    accent: "#0891b2"
    note: Portal and billing systems shared across all tenants
  - id: customer-a
    name: Customer A - Acme Logistics
    parent: customers
    accent: "#2563eb"
  - id: customer-b
    name: Customer B - Bramble Retail
    parent: customers
    accent: "#16a34a"
  - id: customer-c
    name: Customer C - Cobalt Legal
    parent: customers
    accent: "#ca8a04"
    note: Smallest tenant, single router and one laptop
  - id: customer-d
    name: Customer D - Delta Studio
    parent: customers
    accent: "#7c3aed"
    note: Wireless-first small office

devices:
  - id: pop-core-01
    name: MSP Core Switch
    icon: cisco/switches/layer-3-switch
    tier: core
    zone: pop
    hero: true
    mgmt_ip: 172.20.0.10
    note: Hero device - MSP core POP, hub for every customer VPN tunnel
