marrow: 2
name: Edge Case 08 - Partial Pinned Layout
description: >
  Layout stress case: exactly half of the devices carry explicit pin
  coordinates while the rest are left for the layout engine to place,
  to exercise mixed pinned/auto-placed positioning in the same graph.

zones:
  - id: core
    name: Core
  - id: dist
    name: Distribution
  - id: access
    name: Access

devices:
  - id: core-sw-01
    name: Core Switch 1
    icon: cisco/switches/layer-3-switch
    tier: core
    zone: core
    ha_pair_with: core-sw-02
    pin: { x: 0, y: 0 }
  - id: core-sw-02
    name: Core Switch 2
    icon: cisco/switches/layer-3-switch
    tier: core
    zone: core
    ha_pair_with: core-sw-01
    pin: { x: 200, y: 0 }
  - id: dist-sw-01
    name: Distribution Switch 1
    icon: cisco/switches/multilayer-remote-switch
    tier: distribution
    zone: dist
    pin: { x: -100, y: 150 }
  - id: dist-sw-02
    name: Distribution Switch 2
    icon: cisco/switches/multilayer-remote-switch
    tier: distribution
    zone: dist
    pin: { x: 300, y: 150 }
  - id: acc-sw-01
    name: Access Switch 1
    icon: cisco/switches/workgroup-switch
    tier: access
    zone: access
  - id: acc-sw-02
    name: Access Switch 2
    icon: cisco/switches/workgroup-switch
    tier: access
    zone: access
  - id: srv-file-01
    name: File Server
    icon: cisco/servers/file-server
    tier: endpoint
    zone: access
  - id: pc-design-01
    name: Design Workstation
    icon: cisco/endpoints/macintosh
    tier: endpoint
    zone: access

links:
  - from: core-sw-01:Te1/0/1
    to: core-sw-02:Te1/0/1
    kind: dac
    speed: 40G
    lag: po1
  - from: core-sw-01:Te1/0/10
    to: dist-sw-01:Te1/1/1
    kind: fiber
    speed: 10G
  - from: core-sw-02:Te1/0/10
    to: dist-sw-02:Te1/1/1
    kind: fiber
    speed: 10G
  - from: dist-sw-01:Gi1/0/1
    to: acc-sw-01:Gi0/48
    kind: fiber
    speed: 1G
  - from: dist-sw-02:Gi1/0/1
    to: acc-sw-02:Gi0/48
    kind: fiber
    speed: 1G
  - from: acc-sw-01:Gi0/1
    to: srv-file-01:eno1
    kind: copper
    speed: 1G
  - from: acc-sw-02:Gi0/1
    to: pc-design-01:en0
    kind: copper
    speed: 1G
