    to: srv-file1:eno1
    kind: copper
    speed: 1G
  - from: acc-sw1:Gi0/1
    to: ws-01:eth0
    kind: copper
    speed: 1G
  - from: acc-sw1:Gi0/2
    to: ws-02:eth0
    kind: copper
    speed: 1G
  - from: acc-sw1:Gi0/3
    to: printer-01:eth0
    kind: copper
