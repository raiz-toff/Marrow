    name: Edge Router 1
    icon: cisco/routers/router
    tier: edge
    zone: wan
    role: Internet Edge Router
    mgmt_ip: 203.0.113.1
    hero: true
  - id: fw1
    name: Perimeter Firewall
    icon: cisco/security/firewall
    tier: edge
    zone: wan
    role: Perimeter Firewall
    mgmt_ip: 10.0.0.1
  - id: core-sw1
    name: Core Switch 1
    icon: cisco/switches/layer-3-switch
    tier: core
    zone: lan
    mgmt_ip: 10.0.1.1
  - id: acc-sw1
    name: Access Switch 1
    icon: cisco/switches/workgroup-switch
    tier: access
    zone: lan
  - id: acc-sw2
    name: Access Switch 2
    icon: cisco/switches/workgroup-switch
    tier: access
    zone: lan
  - id: ws-01
    name: Workstation 01
    icon: cisco/computer-and-peripherals/pc
    tier: endpoint
    zone: lan
  - id: ws-02
    name: Laptop 02
    icon: cisco/computer-and-peripherals/laptop
    tier: endpoint
    zone: lan
  - id: ws-03
    name: iMac 03
    icon: cisco/computer-and-peripherals/macintosh
    tier: endpoint
    zone: lan
  - id: printer-01
    name: Office Printer
    icon: cisco/computer-and-peripherals/printer
    tier: endpoint
    zone: lan
  - id: voip-01
    name: Reception IP Phone
    icon: cisco/datacenter/ip-phone
    tier: endpoint
    zone: lan
  - id: srv-file1
    name: File Server
    icon: cisco/servers/file-server
    tier: endpoint
    zone: servers
    mgmt_ip: 10.0.2.10

links:
