marrow: 2
name: Branch Office Alpha
description: Small branch — single edge router, single firewall, one core switch, two access switches
zones:
  - id: wan
    name: WAN Edge
  - id: lan
    name: Branch LAN
  - id: servers
    name: Server Nook
    parent: lan

devices:
