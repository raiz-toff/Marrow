marrow: 2
name: University Campus - Admin, Library, and Residential
description: Campus core datacenter fanning out to admin and library buildings plus a residential zone with two nested dorm sub-zones, dense wireless access
theme: light
hero: dc-core-01

zones:
  - id: datacenter
    name: Campus Datacenter
    accent: "#0f172a"
  - id: admin
    name: Admin Building
    accent: "#b91c1c"
  - id: library
    name: Library
    accent: "#7c2d12"
  - id: dorms
    name: Residential Halls
    accent: "#4338ca"
    note: Shared residential WLAN controller lives here
  - id: dorm-a
    name: Dorm A - Founders Hall
    parent: dorms
    accent: "#0891b2"
  - id: dorm-b
    name: Dorm B - Lakeside Hall
    parent: dorms
    accent: "#059669"

