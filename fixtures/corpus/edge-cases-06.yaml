marrow: 2
name: Edge Case 06 - Full Enum Coverage
description: >
  Layout stress case: touches every enum value in the schema at least
  once - all 6 device tiers, all 5 device statuses, all 3 zone collapse
  modes, all 7 link kinds, all 10 link speeds, and all 4 link statuses -
  to exercise every style/branch in the renderer in one pass.
theme: dark
hero: core-rt-01

zones:
  - id: core-zone
    name: Core
    collapse: auto
  - id: access-zone
    name: Access Floor
    collapse: open
  - id: edge-zone
    name: Edge
    collapse: closed
  - id: mgmt-zone
    name: Management

devices:
  - id: core-rt-01
    name: Core Router
    icon: cisco/routers/router
    tier: core
    zone: core-zone
    status: up
    hero: true
  - id: dist-sw-01
    name: Distribution Switch
    icon: cisco/switches/multilayer-remote-switch
    tier: distribution
    zone: access-zone
    status: down
  - id: acc-sw-01
    name: Access Switch
    icon: cisco/switches/workgroup-switch
    tier: access
    zone: access-zone
    status: degraded
  - id: edge-fw-01
    name: Edge Firewall
    icon: cisco/security/firewall
    tier: edge
    zone: edge-zone
    status: planned
  - id: mgmt-sw-01
    name: Management Switch
    icon: cisco/switches/layer-3-switch
    tier: management
    zone: mgmt-zone
    status: unknown
  - id: srv-endpoint-01
    name: File Server
    icon: cisco/servers/file-server
    tier: endpoint
    zone: access-zone
    status: up
  - id: pc-endpoint-01
    name: Design Workstation
    icon: cisco/computer-and-peripherals/macintosh
    tier: endpoint
    zone: access-zone
    status: down

links:
  - from: core-rt-01:Gi0/0/1
    to: edge-fw-01:outside
    kind: wan
    speed: 10M
    status: up
  - from: edge-fw-01:inside
    to: dist-sw-01:Te1/1/1
    kind: fiber
    speed: 100M
    status: up
  - from: dist-sw-01:Te1/1/2
    to: acc-sw-01:Gi1/0/1
    kind: copper
    speed: 1G
    status: down
  - from: acc-sw-01:Gi1/0/2
    to: srv-endpoint-01:eno1
    kind: copper
    speed: 2.5G
    status: up
  - from: acc-sw-01:Gi1/0/3
    to: pc-endpoint-01:en0
    kind: wireless
    speed: 5G
    status: degraded
  - from: dist-sw-01:Te1/1/3
    to: mgmt-sw-01:Gi0/1
    kind: serial
    speed: 10G
    status: up
  - from: core-rt-01:Gi0/0/2
    to: dist-sw-01:Te1/1/4
    kind: dac
    speed: 25G
    status: planned
  - from: edge-fw-01:Gi0/2
    to: acc-sw-01:Gi1/0/4
    kind: virtual
    speed: 40G
    status: up
  - from: core-rt-01:Gi0/0/3
    to: mgmt-sw-01:Gi0/2
    kind: copper
    speed: 100G
    status: down
  - from: dist-sw-01:Te1/1/5
    to: srv-endpoint-01:eno2
    kind: fiber
    speed: 400G
    status: up
