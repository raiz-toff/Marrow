marrow: 2
name: Feature Showcase
description: Status rings · tags · badges · callouts · zone notes · anchored annotations
density: spacious
scale: 1.15
author: NetOps Architecture Team
revision: v2.4
date: "2026-10-18"
title_block:
  title: Enterprise Edge & Core Fabric
  author: NetOps Architecture Team
  revision: v2.4
  date: "2026-10-18"
zones:
  - id: production
    name: Production
    accent: "#10b981"
    note: Change-freeze until Friday
  - id: lab
    name: Lab
    accent: "#8b5cf6"
devices:
  - id: edge-fw
    name: Edge Firewall
    icon: cisco/security/firewall
    tier: core
    role: firewall
    status: up
    mgmt_ip: 203.0.113.1
    note: |-
      Internet edge.
      Failover pair with EDGE_FW_2.
      Purpose: Perimeter security + NAT
      Location: DC-1 / Rack A1
    custom_fields:
      Serial Number: "FOC21345678"
      Rack Location: "DC-1 / Rack A1"
      Firmware: "ASA 9.18(3)"
      Failover Mode: "Active / Standby"
    sections:
      Firewall Policies: |
        | Rule | Protocol | Port | Action | Direction |
        | 10   | TCP      | 443  | Allow  | Inbound   |
        | 20   | TCP      | 80   | Allow  | Inbound   |
        | 30   | UDP      | 53   | Allow  | Outbound  |
        | 99   | IP       | Any  | Deny   | Inbound   |
    x-v1-tags:
      - 203.0.113.1
      - asa-9.18
    x-v1-badges:
      - text: HA
        color: emerald
      - text: IPS
        color: rose
        position: bottom-right
  - id: core-a
    name: Core A
    icon: cisco/switches/layer-3-switch
    tier: distribution
    zone: production
    role: core
    status: up
    custom_fields:
      Serial Number: "FOC98765432"
      BGP ASN: 65001
      Software: "IOS-XE 17.9.4a"
    sections:
      BGP Neighbors:
        - Peer: "10.0.0.3"
          AS: 65001
          Uptime: "45d 12h"
          State: "Established"
        - Peer: "203.0.113.1"
          AS: 65000
          Uptime: "128d 4h"
          State: "Established"
    x-v1-tags:
      - 10.0.0.2
      - hsrp-active
    x-v1-badges:
      - text: HSRP
        color: indigo
  - id: core-b
    name: Core B
    icon: cisco/switches/layer-3-switch
    tier: distribution
    zone: lab
    role: core
    status: degraded
    note: Fan tray degraded — RMA open
    x-v1-tags:
      - 10.0.0.3
      - hsrp-standby
    x-v1-badges:
      - text: HSRP
        color: slate
  - id: dist-prod
    name: Dist Prod
    icon: cisco/switches/workgroup-switch
    tier: access
    zone: production
    role: distribution
  - id: srv-app
    name: App Server
    icon: cisco/servers/standard-host
    tier: endpoint
    zone: production
    role: server
    status: up
    x-v1-tags:
      - vlan-20
  - id: srv-db
    name: DB Server
    icon: cisco/servers/standard-host
    tier: endpoint
    zone: production
    role: server
    status: down
    note: Disk array offline since 02:10
    x-v1-tags:
      - vlan-20
  - id: dist-lab
    name: Dist Lab
    icon: cisco/switches/workgroup-switch
    tier: access
    zone: lab
    role: distribution
    status: unknown
  - id: lab-pc1
    name: Lab PC 1
    icon: cisco/endpoints/pc
    tier: endpoint
    zone: lab
    role: host
  - id: lab-pc2
    name: Lab PC 2
    icon: cisco/endpoints/pc
    tier: endpoint
    zone: lab
    role: host
links:
  - from: edge-fw:Te0/0
    to: core-a:Te1/1/1
    kind: fiber
    speed: 10G
    custom_fields:
      Transceiver: "10GBASE-LR"
      Serial: "SFP-990812"
    sections:
      Optical Power: "Tx: -2.1 dBm · Rx: -3.4 dBm (Normal)"
  - from: edge-fw:Te0/1
    to: core-b:Te1/1/1
    kind: fiber
  - from: core-a:Te1/0/1
    to: core-b:Te1/0/1
    lag: po1
  - from: core-a:Te1/0/2
    to: core-b:Te1/0/2
    lag: po1
  - from: core-a:Gi1/0/10
    to: dist-prod:Gi0/1
    kind: fiber
  - from: core-b:Gi1/0/10
    to: dist-lab:Gi0/1
    kind: fiber
  - from: dist-prod
    to: srv-app
    label: vlan 20
  - from: dist-prod
    to: srv-db
    label: vlan 20
  - from: dist-lab
    to: lab-pc1
  - from: dist-lab
    to: lab-pc2
