marrow: 2
name: Dual-Colocation Enterprise Showcase
description: Curated active-active dual colocation network architecture spanning
  Ashburn DC-1 (US-East) and Santa Clara DC-2 (US-West) with 100G MACsec DCI,
  EVPN-VXLAN spine-leaf fabric, perimeter NGFW security, and replicated
  enterprise data tiers.
density: standard
scale: 1.05
hero: east-spine-01
author: Enterprise Infrastructure & Cloud Architecture
revision: v2.0
date: 2026-10-25
title_block:
  title: Dual-Colocation Enterprise Architecture
  author: Enterprise Architecture & NetOps
  revision: v2.0
  date: 2026-10-25
about:
  Overview: Executive showcase topology illustrating an enterprise active-active
    dual-colocation architecture across Equinix Ashburn (DC-1) and Equinix Santa
    Clara (DC-2).
  Fabric & Underlay: >-
    - BGP unnumbered EVPN-VXLAN fabric with redundant spines and MLAG/vPC leaf
    pairs

    - 100Gbps non-blocking backplane with sub-microsecond latency

    - Anycast gateway routing across DC-1 and DC-2
  Security & Ingress: |-
    - Perimeter Palo Alto PA-5450 HA clusters with active threat prevention
    - Unified F5 WAF & LTM ADC application delivery in dedicated DMZ
    - Strict Tier-0 jump bastions with hardware MFA
  Data Center Interconnect (DCI): >-
    - Dual diverse optical dark fiber paths with line-rate IEEE 802.1AE MACsec
    256-bit encryption

    - Sub-35ms round-trip latency supporting synchronous storage mirroring and
    active database replication
