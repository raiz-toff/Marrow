marrow: 2
name: Dual-Colocation Multi-Zone Enterprise Fabric
description: 208 devices across Ashburn DC-1 (US-East) and Santa Clara DC-2
  (US-West) with 400G DCI, EVPN-VXLAN spine-leaf fabric, DMZ, Core Services,
  vSphere compute pods, Kubernetes clusters, and replicated storage.
density: compact
scale: 0.95
hero: east-spine-01
author: Enterprise Infrastructure & Cloud Architecture
revision: v1.0
date: 2026-10-25
title_block:
  title: Dual-Colocation Enterprise Network
  author: Enterprise Architecture & NetOps
  revision: v1.0
  date: 2026-10-25
about:
  Overview: Enterprise-grade active-active dual colocation network architecture
    spanning Equinix DC-1 (Ashburn, VA) and Equinix DC-2 (Santa Clara, CA).
    Connected via redundant 400Gbps MACsec-encrypted dark fiber DCI and diverse
    Tier-1 carrier transit.
  Fabric Architecture: >-
    - Underlay: BGP unnumbered EVPN-VXLAN spine-leaf fabric operating at
    100G/400G

    - Dual spine switches per facility paired with redundant MLAG/vPC leaf pairs

    - Dedicated leaf pairs partitioned by security enclave: DMZ, Core Services,
    Compute, Kubernetes, and Data Storage

    - Anycast default gateways for seamless multi-tenant workload mobility
  Security & Ingress: >-
    - Edge perimeter inspection via Palo Alto PA-5450 active/passive NGFW
    clusters

    - Web Application Firewalls (WAF) and F5 BIG-IP LTM/GTM load balancers in
    dedicated DMZ pods

    - Dual dedicated Bastion/Jump hosts with strict hardware-token MFA and
    air-gapped OOB management island
  Disaster Recovery & Data Replication: >-
    - Active-active application workloads across East and West compute tiers

    - Synchronous SAN replication for tier-0 block storage and asynchronous
    streaming replication for PostgreSQL, Redis, and Kafka brokers

    - Geo-redundant external DNS failover via Anycast GTM
