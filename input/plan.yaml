# ═══════════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════════
title: "Trunk Port Configuration Lab"
description: "VLAN segmentation and 802.1Q trunking between two Cisco 2960 switches with native VLAN security."
project_url: "https://rajkumarneupane.com/projects/trunk-port-configuration-lab/"
author: "RajkumarNeupane"
version: "1.0"

# ═══════════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════════
config:
  engines: [flow, hierarchical, radial]
  layouts: [realistic, blueprint]
  output_filename: "TrunkPortConfiguration"

# ═══════════════════════════════════════════════════════════════
# NODES
# ═══════════════════════════════════════════════════════════════
nodes:
  # ─── SWITCH 0 ───
  - id: SWITCH_0
    label: "Switch 0"
    icon: Cisco/Switches/workgroup_switch
    role: access
    model: "Cisco 2960"
    x: -300
    y: 0
    level: 1
    design_notes: |
      Core access switch 1.
      Trunk link to Switch 1 via Gi0/1.
    running_config: |
      hostname Switch0
      !
      vlan 10
       name SALES
      vlan 20
       name ENGINEERING
      !
      interface GigabitEthernet0/1
       description Trunk to Switch1
       switchport mode trunk
       switchport trunk native vlan 199
       switchport trunk allowed vlan 10,20
       no shutdown
      !
      interface Range FastEthernet0/1-2
       switchport mode access
       switchport access vlan 10
      !
      interface Range FastEthernet0/3-4
       switchport mode access
       switchport access vlan 20
      !
      interface range fa0/5 - 24
       shutdown
      interface range g0/2
       shutdown

  # ─── SWITCH 1 ───
  - id: SWITCH_1
    label: "Switch 1"
    icon: Cisco/Switches/workgroup_switch
    role: access
    model: "Cisco 2960"
    x: 300
    y: 0
    level: 1
    running_config: |
      hostname Switch1
      !
      vlan 10
       name SALES
      vlan 20
       name ENGINEERING
      !
      interface GigabitEthernet0/1
       description Trunk to Switch0
       switchport mode trunk
       switchport trunk native vlan 199
       switchport trunk allowed vlan 10,20
       no shutdown
      !
      interface Range FastEthernet0/1-2
       switchport mode access
       switchport access vlan 10
      !
      interface Range FastEthernet0/3-4
       switchport mode access
       switchport access vlan 20

  # ─── SWITCH 0 ENDPOINTS ───
  - id: PC_0
    label: "PC0 (Sales)"
    icon: Cisco/ComputerAndPeripherals/pc
    role: host
    ip: "10.10.10.1"
    x: -450
    y: -150
    level: 2
    parent: SWITCH_0

  - id: PC_1
    label: "PC1 (Sales)"
    icon: Cisco/ComputerAndPeripherals/pc
    role: host
    ip: "10.10.10.2"
    x: -450
    y: -50
    level: 2
    parent: SWITCH_0

  - id: PC_2
    label: "PC2 (Eng)"
    icon: Cisco/ComputerAndPeripherals/pc
    role: host
    ip: "10.10.10.3"
    x: -450
    y: 50
    level: 2
    parent: SWITCH_0

  - id: PC_3
    label: "PC3 (Eng)"
    icon: Cisco/ComputerAndPeripherals/pc
    role: host
    ip: "10.10.10.4"
    x: -450
    y: 150
    level: 2
    parent: SWITCH_0

  # ─── SWITCH 1 ENDPOINTS ───
  - id: PC_4
    label: "PC4 (Sales)"
    icon: Cisco/ComputerAndPeripherals/pc
    role: host
    ip: "10.10.10.5"
    x: 450
    y: -150
    level: 2
    parent: SWITCH_1

  - id: PC_5
    label: "PC5 (Sales)"
    icon: Cisco/ComputerAndPeripherals/pc
    role: host
    ip: "10.10.10.6"
    x: 450
    y: -50
    level: 2
    parent: SWITCH_1

  - id: PC_6
    label: "PC6 (Eng)"
    icon: Cisco/ComputerAndPeripherals/pc
    role: host
    ip: "10.10.10.7"
    x: 450
    y: 50
    level: 2
    parent: SWITCH_1

  - id: PC_7
    label: "PC7 (Eng)"
    icon: Cisco/ComputerAndPeripherals/pc
    role: host
    ip: "10.10.10.8"
    x: 450
    y: 150
    level: 2
    parent: SWITCH_1

# ═══════════════════════════════════════════════════════════════
# LINKS
# ═══════════════════════════════════════════════════════════════
links:
  # ─── TRUNK LINK ───
  - from: SWITCH_0
    to: SWITCH_1
    cable: crossover
    from_port: "Gi0/1"
    to_port: "Gi0/1"
    speed: "1G"
    notes: "Native VLAN 199 | Allowed: 10,20"
    layer2:
      mode: trunk
      native_vlan: 199
      allowed_vlans: "10,20"

  # ─── SWITCH 0 ACCESS LINKS ───
  - from: SWITCH_0
    to: PC_0
    cable: ethernet
    from_port: "Fa0/1"
    layer2: { mode: access, vlan: 10 }

  - from: SWITCH_0
    to: PC_1
    cable: ethernet
    from_port: "Fa0/2"
    layer2: { mode: access, vlan: 10 }

  - from: SWITCH_0
    to: PC_2
    cable: ethernet
    from_port: "Fa0/3"
    layer2: { mode: access, vlan: 20 }

  - from: SWITCH_0
    to: PC_3
    cable: ethernet
    from_port: "Fa0/4"
    layer2: { mode: access, vlan: 20 }

  # ─── SWITCH 1 ACCESS LINKS ───
  - from: SWITCH_1
    to: PC_4
    cable: ethernet
    from_port: "Fa0/1"
    layer2: { mode: access, vlan: 10 }

  - from: SWITCH_1
    to: PC_5
    cable: ethernet
    from_port: "Fa0/2"
    layer2: { mode: access, vlan: 10 }

  - from: SWITCH_1
    to: PC_6
    cable: ethernet
    from_port: "Fa0/3"
    layer2: { mode: access, vlan: 20 }

  - from: SWITCH_1
    to: PC_7
    cable: ethernet
    from_port: "Fa0/4"
    layer2: { mode: access, vlan: 20 }

# ═══════════════════════════════════════════════════════════════
# GROUPS
# ═══════════════════════════════════════════════════════════════
groups:
  - name: "Sales Department (VLAN 10)"
    nodes: ["PC_0", "PC_1", "PC_4", "PC_5"]
    color: "rgba(30, 144, 255, 0.12)"
    style: dashed

  - name: "Engineering Dept (VLAN 20)"
    nodes: ["PC_2", "PC_3", "PC_6", "PC_7"]
    color: "rgba(46, 139, 87, 0.12)"
    style: dashed

# ═══════════════════════════════════════════════════════════════
# ANNOTATIONS
# ═══════════════════════════════════════════════════════════════
annotations:
  - text: "TRUNK CONFIGURATION LAB"
    x: 0
    y: -350
    style: h1

  - text: |
      NATIVE VLAN: 199
      ALLOWED: 10, 20
    x: 0
    y: -50
    style: note

  - text: "VLAN 10"
    target: "PC_0"
    position: left
    style: tag

  - text: "VLAN 20"
    target: "PC_2"
    position: left
    style: tag