marrow: 2
name: "Meridian Group — DC1 · Ashburn (US-East)"
description: "One of 194 sites in a 15,591-device global topology — a Tier III+ EVPN/VXLAN datacenter: 400G spine/leaf fabric, vSphere compute pods, Kubernetes, SAN/object storage, and a hardened internet edge."
theme: dark
zones:
  - { id: dc1, name: "DC1 — Ashburn US-East", accent: "#4fc3a1", note: "Ashburn, USA — Tier III+ 4MW facility; Lumina DIA + TerraLink/OrbitTel MPLS; PCI + SOX scoped halls; AS65010.", x-tags: ["region:amer", "site:dc1", "kind:datacenter", "scale:mega", "function:core"] }
  - { id: dc1-fabric, name: "EVPN/VXLAN Fabric", parent: dc1, note: "Arista 7808R3 spines + Arista 7280R3-48Y8C leafs — BGP-EVPN AS65010, MLAG pairs, 400G fabric." }
  - { id: dc1-edge, name: "Internet Edge", parent: dc1, accent: "#e2725b", note: "Dual DIA + MPLS CE, perimeter NGFW, DDoS scrub, VPN hubs, DCI and cloud on-ramps." }
  - { id: dc1-dmz, name: "DMZ — screened subnet", parent: dc1-edge, note: "Public-facing services behind WAF + external LB; egress via perimeter PA-7500 pair." }
  - { id: dc1-netsvc, name: "Network Services", parent: dc1, note: "Core shared services — internal FW, GTM/DNS, LB, AAA, AD, NTP, taps." }
  - { id: dc1-compute, name: "Compute — vSphere", parent: dc1, note: "4 pods, vSphere 8.0U3 + NSX 4.1.2; 64 ESXi hosts." }
  - { id: dc1-pod-1, name: "Pod 1 — general prod A", parent: dc1-compute, note: "Rack row C — dual 25G MLAG to leaf pair." }
  - { id: dc1-pod-2, name: "Pod 2 — general prod B", parent: dc1-compute, note: "Rack row D — dual 25G MLAG to leaf pair." }
  - { id: dc1-pod-3, name: "Pod 3 — VDI", parent: dc1-compute, note: "Rack row E — dual 25G MLAG to leaf pair." }
  - { id: dc1-pod-4, name: "Pod 4 — staging/dev", parent: dc1-compute, note: "Rack row F — dual 25G MLAG to leaf pair." }
  - { id: dc1-storage, name: "Storage & Backup", parent: dc1, note: "FC SAN A/B fabrics, all-flash arrays, object tier, PowerProtect backup." }
  - { id: dc1-k8s-prod, name: "Kubernetes — prod", parent: dc1, note: "RKE2 v1.29 — Cilium CNI, mTLS mesh; PCI namespaces isolated by netpol." }
  - { id: dc1-k8s-stg, name: "Kubernetes — staging", parent: dc1, note: "Pre-prod cluster — conformance + chaos testing before prod rollout." }
  - { id: dc1-docker, name: "Docker Swarm (legacy)", parent: dc1, note: "Legacy swarm stack — migration to k8s tracked CHG0771613, freeze on new services." }
  - { id: dc1-db, name: "Databases & Streaming", parent: dc1, note: "PostgreSQL, Oracle RAC (SOX), MongoDB, Kafka, Redis, ClickHouse." }
  - { id: dc1-mgmt-oob, name: "Management & OOB", parent: dc1, note: "Air-gapped OOB — console servers, jump hosts, DCIM, pollers, NetBox." }
  - { id: dc1-facilities, name: "Facilities & Physical Security", parent: dc1, note: "PDUs, CRAC, UPS, CCTV and badge controllers — BMS on isolated VLAN 70." }
  - { id: stub-wan, name: "WAN (harness stub)" }
